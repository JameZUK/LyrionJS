<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' ws: wss: http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0f1115">
<title>LyrionJS</title>
<link rel="icon" href="@@LOGO_URI@@">
<link rel="apple-touch-icon" href="/plugins/LyrionJS/html/images/apple-touch-icon.png">
<style>
/*@@CSS@@*/
</style>
</head>
<body>
/*@@LOGO@@*/
<header id="top">
  <button id="menuBtn" class="ib" aria-label="Menu" title="Menu" aria-expanded="false" aria-controls="nav"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
  <div class="brand"><svg class="brand-logo" aria-hidden="true"><use href="#lj-logo"/></svg>LyrionJS</div>
  <div id="serverName"></div>
  <button id="localBadge" class="badge off" type="button" title="Rename this player"></button>
  <div class="spacer"></div>
  <div id="topVol"></div>
  <button id="playerBtn" aria-label="Choose a player"></button>
  <button id="sideBtn" class="ib" aria-label="Show the queue" title="Show the queue" aria-pressed="false" aria-controls="side"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg></button>
</header>
<nav id="nav" aria-label="Main"></nav>
<div id="scrim"></div>
<main id="view"></main>
<aside id="side" aria-label="Queue" hidden></aside>
<footer id="bar" aria-label="Player controls"></footer>
<button id="fab" aria-label="Search" title="Search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
<button id="hostBtn" aria-label="LyrionJS" title="LyrionJS"><svg aria-hidden="true"><use href="#lj-logo"/></svg></button>
<div id="sheet" hidden></div>
<button id="unlock" hidden>Click to enable sound in this browser</button>
<div id="conn" hidden role="status"></div>
<button id="update" hidden>A new version of LyrionJS is ready — reload</button>
<div id="toast" role="status" aria-live="polite"></div>
<audio id="lj-audio" playsinline hidden></audio>
<script id="lj-worklet">
/*@@WORKLET@@*/
</script>
<script id="lj-lib">
/*@@LIB@@*/
</script>
<script id="lj-app">
/*@@APP@@*/
</script>
</body>
</html>
